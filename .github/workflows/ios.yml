# iOS native (apps/ios) — ADR-0001, #223.
#
# Hai job, hai lời hứa khác nhau:
#   core-linux  ASCNDCore + golden vectors build và test được trên Linux. Nếu
#               ai đưa UIKit/SwiftUI vào Core, job này đỏ — ranh giới giữ bằng
#               máy, không bằng lời dặn. Chạy nhanh, không tốn runner macOS.
#   app-macos   XcodeGen sinh project từ project.yml, app build cho simulator,
#               test của package chạy trên macOS. Không ký: ký là việc của máy
#               Kiệt (Xcode) hoặc TestFlight (#226).
#
# Lọc theo path: PR không chạm iOS thì không tốn mười phút macOS. Vì thế job
# này KHÔNG đặt làm required check (ADR-0002) — PR không chạm path sẽ treo.
name: iOS

on:
  push:
    branches: ['native/**', main]
    paths:
      - 'apps/ios/**'
      - 'spec/vectors/**'
      - '.github/workflows/ios.yml'
      # Chỉ sửa tài liệu (sổ hạn chế, ghi chú) thì không cần build app 15 phút
      # (Kiệt 28/10: tăng tốc CI). Cổng chất lượng vẫn chạy và vẫn đọc tài liệu.
      - '!apps/ios/docs/**'
      - '!apps/ios/**/*.md'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'spec/vectors/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/docs/**'
      - '!apps/ios/**/*.md'
  workflow_dispatch:

# Mỗi commit một lượt (#527, chỉ thị 6093313700): A và E cùng đẩy lên một
# nhánh, và CI chỉ được báo xanh trên ĐÚNG SHA — nhóm theo nhánh làm commit của
# người này huỷ lượt của commit người kia. Đẩy lên nhánh: nhóm theo SHA, không
# huỷ. PR giữ như cũ: commit mới trong PR huỷ lượt của commit nó thay.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Giữ `.build` giữa các lượt (28/10): phụ thuộc và module không đổi không
      # build lại. Khoá theo nhánh + SHA, lấy lại bản gần nhất của nhánh / của
      # native/ios-rewrite. Cache hỏng chỉ làm chậm, không làm sai: SwiftPM tự
      # build lại phần đổi.
      - uses: actions/cache@v4
        with:
          path: apps/ios/Packages/ASCNDKit/.build
          key: spm-linux-kit-${{ hashFiles('apps/ios/Packages/ASCNDKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-linux-kit-${{ hashFiles('apps/ios/Packages/ASCNDKit/Package.swift') }}-
      - name: swift test (ASCNDKit)
        working-directory: apps/ios/Packages/ASCNDKit
        run: swift test

  app-macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Ảnh runner có nhiều bản Xcode; lấy bản mới nhất để SDK iOS mới nhất
      # (Liquid Glass cần SDK iOS 26) mà không ghim một số phiên bản sẽ cũ.
      - name: Chọn Xcode mới nhất
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Cache build giữa các lượt (Kiệt 28/10: tăng tốc CI). `irgaly/xcode-cache`
      # giữ DerivedData + gói SPM VÀ khôi phục mtime của mã nguồn, nên Xcode build
      # tăng dần thay vì từ đầu. `.build` của ba package cho `swift test`.
      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-deriveddata-${{ github.sha }}
          restore-keys: xcode-deriveddata-
      - uses: actions/cache@v4
        with:
          path: |
            apps/ios/Packages/ASCNDKit/.build
            apps/ios/Packages/ASCNDBackend/.build
            apps/ios/Packages/ASCNDStore/.build
          key: spm-macos-${{ hashFiles('apps/ios/Packages/*/Package.resolved', 'apps/ios/Packages/*/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-macos-${{ hashFiles('apps/ios/Packages/*/Package.resolved', 'apps/ios/Packages/*/Package.swift') }}-

      - name: XcodeGen
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: swift test (ASCNDKit, macOS)
        working-directory: apps/ios/Packages/ASCNDKit
        run: swift test

      - name: swift test (ASCNDBackend, macOS)
        working-directory: apps/ios/Packages/ASCNDBackend
        run: swift test

      - name: swift test (ASCNDStore, macOS)
        working-directory: apps/ios/Packages/ASCNDStore
        run: swift test

      - name: Build app (iOS Simulator, không ký)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project ASCND.xcodeproj -scheme ASCND -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "warning:|error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
