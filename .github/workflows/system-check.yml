# Bot kiểm hệ thống (Kiệt 28/10) — nhánh native/ios-rewrite, server Supabase,
# Sentry, PostHog. CHỈ ĐỌC. Logic ở .github/scripts/system-check.mjs (agent nào
# cũng chạy tay được).
#
# Báo cáo:
#   - Summary của lượt chạy (luôn có).
#   - MỘT issue "🤖 Bot kiểm hệ thống" (nhãn system-check): thân issue = báo cáo
#     mới nhất, sửa tại chỗ mỗi lượt.
#   - Comment trên #527 CHỈ khi trạng thái ĐỔI (xanh → có việc, việc mới, hết
#     việc) — không spam mỗi commit.
#
# Secret cần (Settings › Secrets and variables › Actions) — thiếu cái nào thì
# phần ấy ghi "bỏ qua", không làm hỏng lượt chạy:
#   SUPABASE_ACCESS_TOKEN      server (supabase.com › Account › Access Tokens)
#   SENTRY_AUTH_TOKEN          Sentry (scope project:read, event:read)
#   POSTHOG_PERSONAL_API_KEY   PostHog (scope query:read)
#
# `schedule` chỉ chạy khi tệp này nằm trên NHÁNH MẶC ĐỊNH của repo.
name: Bot kiểm hệ thống

on:
  push:
    branches: ['native/ios-rewrite']
  schedule:
    - cron: '0 1 * * *'   # 08:00 giờ Việt Nam
  workflow_dispatch:

concurrency:
  group: system-check
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native/ios-rewrite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.115.0

      # Sau một commit: đợi CI của chính commit ấy chạy xong (tối đa 45 phút) để
      # báo kết quả thật, không phải "đang chạy".
      - name: Đợi CI trên đầu nhánh
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 45); do
            left=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status != "completed") | select(.name != "check") |
                     select(.name | IN("e2e","periphery","analyze-swift","swiftlint") | not)] | length')
            [ "$left" = "0" ] && break
            echo "còn $left check đang chạy…"; sleep 60
          done

      - name: Kiểm
        run: node .github/scripts/system-check.mjs --out report.md --json report.json

      - name: Báo cáo
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          status=$(jq -r .status report.json)
          # Dấu trạng thái: danh sách việc BỎ chữ số (SHA, số ngày, số lần) — đổi
          # khi có việc mới / hết việc, không đổi chỉ vì con số nhích.
          problems=$(jq -r '.problems | map(gsub("[0-9a-f]{7,}|[0-9]+"; "#")) | unique | join("\n")' report.json | sha256sum | cut -c1-12)
          marker="<!-- system-check:${problems} -->"
          num=$(gh issue list -R "${{ github.repository }}" --label system-check --state open --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh label create system-check -R "${{ github.repository }}" --color 0e8a16 --description "Bot kiểm hệ thống" 2>/dev/null || true
            num=$(gh issue create -R "${{ github.repository }}" --title "🤖 Bot kiểm hệ thống" --label system-check \
              --body "$(printf '%s\n%s' "$marker" "$(cat report.md)")" | grep -oE '[0-9]+$')
            prev=""
          else
            prev=$(gh issue view "$num" -R "${{ github.repository }}" --json body --jq .body | grep -oE 'system-check:[0-9a-f]+' | head -1)
            gh issue edit "$num" -R "${{ github.repository }}" --body "$(printf '%s\n%s' "$marker" "$(cat report.md)")"
          fi
          if [ "$prev" != "system-check:${problems}" ]; then
            gh issue comment 527 -R "${{ github.repository }}" --body "$(printf '🤖 **Bot kiểm hệ thống đổi trạng thái: %s** — chi tiết ở #%s\n\n%s' "$status" "$num" "$(jq -r '.problems[:15] | map("- " + .) | join("\n")' report.json)")"
          fi
