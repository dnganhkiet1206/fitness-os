# Test SQL của Cộng đồng — chạy khi `supabase/` đổi (#78).
#
# ── vì sao một workflow riêng ──
#
# `quality-gate.yml` chạy cổng của `native/`, và cổng ấy KHÔNG chạy các bộ SQL
# của Cộng đồng: không `run.sh`, không `b_reverse.py`. Toàn bộ phân quyền của
# Cộng đồng — RLS, RPC SECURITY DEFINER, quyền của anon, chặn hai chiều — được
# kiểm bằng các bộ ấy và các ca đột biến của chúng, nhưng chỉ khi ai đó nhớ chạy
# tay. Một migration mới làm hỏng một policy qua CI xanh.
#
# Riêng một tệp để `paths` lọc được: phần lớn các lần đẩy chỉ chạm `native/`,
# và hai bước dưới đây không có gì để nói về chúng.
#
# ── hai bước, theo thứ tự ──
#
#   1. `run.sh`: mọi migration cộng đồng trên một cụm PostgreSQL 16 tạm, rồi mọi
#      bộ kịch bản. Đỏ ở đây là một luật đã hỏng.
#   2. `b_reverse.py`: phá từng luật một (mỗi ca một database mới, chạy MỌI bộ)
#      và đòi đúng kịch bản của nó đỏ. Xanh ở bước 1 mà đỏ ở đây là một kịch bản
#      không còn đo điều nó nói.
#
# Không `sudo` cho hai bước: cả hai rẽ theo quyền (root thì hạ sang `postgres`,
# người dùng thường chạy thẳng), vì `initdb` từ chối chạy dưới root.
#
# ── hai job nữa trong cùng tệp, để cùng `paths` lọc `supabase/` ──
#
# `all-migrations` (AUD-13): hai bộ của job `sql` tách đôi migration —
# cộng đồng chỉ áp `*_community_*`, lõi áp phần còn lại — nên không bộ nào
# thấy hai nửa đụng nhau. Job này áp TẤT CẢ lên một cụm Postgres 16 tạm
# duy nhất, theo thứ tự tên tệp như production.
#
# `deno` (R2-OPS-07): `supabase/functions/` có đúng một tệp test Deno
# (`ai-log-parse/parse_test.ts`) mà không workflow nào chạy. Job này chạy
# `deno test` trên cả thư mục, Deno ghim bản cố định, nên tệp `*_test.ts`
# mới tự được chạy mà không ai phải sửa workflow.

name: Test SQL Cộng đồng

on:
  push:
    branches: ['claude/**', 'native/**', main]
    paths: ['supabase/**', '.github/workflows/sql-community.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/sql-community.yml']
  workflow_dispatch:

# Mỗi commit một lượt (#527, chỉ thị 6093313700): A và E cùng đẩy lên một
# nhánh, và CI chỉ được báo xanh trên ĐÚNG SHA — nhóm theo nhánh làm commit của
# người này huỷ lượt của commit người kia. Đẩy lên nhánh: nhóm theo SHA, không
# huỷ. PR giữ như cũ: commit mới trong PR huỷ lượt của commit nó thay.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sql:
    # Ghim 24.04 như `quality-gate.yml`: `postgresql-16` là gói của noble.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Bộ kịch bản (run.sh)
        run: bash supabase/tests/community/run.sh

      - name: Thử ngược (b_reverse.py)
        run: python3 supabase/tests/community/b_reverse.py

      # Bảng LÕI (#148, #132): mọi migration không phải Cộng đồng, rồi RLS của
      # MỌI bảng public — bảng mới chưa xếp loại thì đỏ (T0). Bộ riêng, stub
      # riêng — xem `supabase/tests/core/run.sh`.
      - name: Bảng lõi — kịch bản (core/run.sh)
        run: bash supabase/tests/core/run.sh

      - name: Bảng lõi — thử ngược (core/reverse.py)
        run: python3 supabase/tests/core/reverse.py

  # AUD-13: hai bộ trên tách đôi migration (cộng đồng / lõi) — không bộ nào
  # áp TẤT CẢ lên một cụm. Job này áp mọi migration theo thứ tự tên tệp lên
  # một cụm Postgres 16 tạm duy nhất; đỏ là schema production không dựng
  # được từ đầu. Chạy trên mọi PR chạm `supabase/` như job `sql`.
  all-migrations:
    # Ghim 24.04 như job `sql`: `postgresql-16` là gói của noble.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Mọi migration trên một cụm (all-migrations/run.sh)
        run: bash supabase/tests/all-migrations/run.sh

  # R2-OPS-07: tệp test Deno duy nhất (`ai-log-parse/parse_test.ts`) không
  # workflow nào chạy. Job này chạy `deno test` trên toàn `supabase/functions/`
  # nên tệp `*_test.ts` mới tự được chạy mà không ai phải sửa workflow.
  # Deno ghim đúng bản đã kiểm local (3/3 xanh, Deno 2.9.8).
  deno:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Deno test (supabase/functions)
        run: deno test supabase/functions/
