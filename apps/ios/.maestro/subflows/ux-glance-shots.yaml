# Một lượt chụp các màn UX. App đã mở ở đúng sáng/tối. ${MODE} = light | dark.
appId: com.ascnd.fitnessos.dev
---
- extendedWaitUntil:
    visible:
      id: today.plan.primary
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: quicklog.bar
    timeout: 15000
- assertNotVisible: "Meal · Water · Sleep · Weight"
- takeScreenshot: ux-${MODE}-today
- takeScreenshot: ux-${MODE}-quicklog-bar
- assertNotVisible: "Keeps you training steadily.*"
- scrollUntilVisible:
    element:
      id: today.koaWeek.about
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 50
    speed: 40
- takeScreenshot: ux-${MODE}-today-week
- tapOn:
    id: today.koaWeek.about
# Một vuốt ngắn để lộ câu vừa mở dưới dòng thưởng. scrollUntilVisible chạy quá
# đà và bỏ qua câu ấy.
- swipe:
    start: "50%,72%"
    end: "50%,42%"
    duration: 400
- assertVisible: "Keeps you training steadily.*"
# Cuộn làm thanh tab thu, chỉ còn icon. Vuốt xuống cho nó bung rồi mới chạm chữ.
# Không dùng openLink: iOS hỏi "Open in ASCND Dev?" và chặn mọi flow sau.
- swipe:
    start: "50%,40%"
    end: "50%,78%"
    duration: 500
- swipe:
    start: "50%,40%"
    end: "50%,78%"
    duration: 500
- extendedWaitUntil:
    visible: "Progress"
    timeout: 10000
- tapOn: "Progress"
- extendedWaitUntil:
    visible:
      id: progress.segment.training
    timeout: 15000
- takeScreenshot: ux-${MODE}-progress-top
- scrollUntilVisible:
    element:
      id: progress.results
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 40
- assertNotVisible: "On track — keep this rhythm."
- assertNotVisible: "Add a protein-rich food to each meal."
- assertNotVisible: "Go to bed 30 minutes earlier.*"
- takeScreenshot: ux-${MODE}-progress-results
- scrollUntilVisible:
    element:
      id: progress.alltools
    direction: DOWN
    timeout: 25000
- tapOn:
    id: progress.alltools
- extendedWaitUntil:
    visible:
      id: progress.tool.training
    timeout: 10000
- assertVisible:
    id: progress.tool.biometrics
- assertNotVisible:
    id: progress.tool.weekly
- assertNotVisible:
    id: progress.tool.sleep
- assertNotVisible:
    id: progress.tool.steps
- takeScreenshot: ux-${MODE}-all-tools
- runFlow: back.yaml
# Về Tiến bộ đang cuộn ở mục More: chữ A ở đầu trang không nằm trong khung.
# Dải Ghi nhanh vẫn hiện, đủ để mở bảng.
- extendedWaitUntil:
    visible:
      id: quicklog.bar
    timeout: 15000
- tapOn:
    id: quicklog.bar
- extendedWaitUntil:
    visible:
      id: quicklog.sheet
    timeout: 10000
- assertVisible:
    id: quicklog.workout
- assertVisible:
    id: quicklog.meal
- assertVisible:
    id: quicklog.water
- assertVisible:
    id: quicklog.sleep
- assertVisible:
    id: quicklog.weight
- takeScreenshot: ux-${MODE}-quicklog-menu
- swipe:
    from:
      id: quicklog.sheet
    direction: DOWN
- extendedWaitUntil:
    notVisible:
      id: quicklog.sheet
    timeout: 8000
# Hàng "Nutrition" trong Kết quả nằm trên dải Ghi nhanh. Tab nằm dưới dải.
- tapOn:
    text: "Nutrition"
    below:
      id: quicklog.bar
- extendedWaitUntil:
    visible:
      id: nutrition.search
    timeout: 15000
- assertVisible:
    id: quicklog.bar
- assertNotVisible: "Meal · Water · Sleep · Weight"
- takeScreenshot: ux-${MODE}-nutrition
