# Chip "+ 8 oz" trên thẻ Nước: thẻ Nước đổi từ chưa ghi sang 8 oz, Insight đọc lại số.
appId: com.ascnd.fitnessos.dev
name: water chip updates Water card and Insight
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/day-card.yaml
# Dải thẻ: Giấc ngủ · Bữa · Nước · Tập (`viewAligned`). Maestro trên iOS đưa ngón tới
# điểm cuối ngay rồi GIỮ YÊN tới hết `duration` mới nhấc: thả ra vận tốc 0, nên dải
# thẻ dừng ở thẻ gần nhất. Vuốt từ tâm thẻ (~135 pt) chưa qua nửa thẻ → bật về chỗ cũ.
# Vuốt từ nhãn của thẻ KẾ đang ló ở mép phải (~340 pt, hơn một thẻ) → sang đúng một thẻ.
- swipe:
    from:
      text: "Meal"
      childOf:
        id: today.tile.meal
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: today.meal.manual
    timeout: 5000
- swipe:
    from:
      text: "Water"
      childOf:
        id: today.tile.water
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: today.water.add
    timeout: 5000
- assertVisible:
    id: today.water.add
    text: "\\+ ?8 oz"
- assertVisible:
    id: today.tile.water
    text: "Water"
- takeScreenshot: 02-water-before
- tapOn:
    id: today.water.add
- extendedWaitUntil:
    visible:
      id: today.tile.water
      text: ".*8 / .*oz.*"
    timeout: 10000
- scrollUntilVisible:
    element: "TODAY.S INSIGHT.*"
    direction: UP
    waitToSettleTimeoutMs: 1000
    timeout: 60000
- extendedWaitUntil:
    visible: ".*8 oz.*"
    timeout: 15000
- takeScreenshot: 02-water-after
