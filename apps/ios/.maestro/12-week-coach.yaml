# Thẻ đầu tuần (Kiệt duyệt mock 03/11): hiện thứ Hai tới thứ Tư; từ 04/11 nằm SAU việc chính
# (dải "Tuần này: … · Koa gợi ý ›"), chạm dải để đưa lên. "Giữ lịch như cũ" ẩn thẻ mà không đổi
# lịch. Ngoài ba ngày đầu tuần thì thẻ không hiện, flow chỉ kiểm khi có thẻ.
appId: com.ascnd.fitnessos.dev
name: The Monday week card can be kept as is
---
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible: "NOPE-never"
    timeout: 2500
    optional: true
- runFlow:
    when:
      visible:
        id: today.coach.peek
    commands:
      # Dải nằm sát thanh Ghi nhanh: kéo ra giữa màn rồi mới chạm, kẻo trúng "+ Quick log".
      - scrollUntilVisible:
          element:
            id: today.coach.peek
          direction: DOWN
          timeout: 15000
          visibilityPercentage: 100
          centerElement: true
      - tapOn:
          id: today.coach.peek
      - takeScreenshot: 12-week-coach
      - tapOn:
          id: today.coach.keep
      - extendedWaitUntil:
          notVisible:
            id: today.coach.peek
          timeout: 10000
- scrollUntilVisible:
    element:
      id: today.plan.primary
    direction: UP
- assertVisible:
    id: today.plan.primary
