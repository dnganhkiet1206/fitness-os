# Thẻ đầu tuần (Kiệt duyệt mock 03/11): hiện thứ Hai tới thứ Tư; từ 04/11 nằm SAU việc chính
# (dải "Tuần này: … · Koa gợi ý ›"), chạm dải để đưa lên. "Giữ lịch như cũ" ẩn thẻ mà không đổi
# lịch. Ngoài ba ngày đầu tuần thì thẻ không hiện, flow chỉ kiểm khi có thẻ.
appId: com.ascnd.fitnessos.dev
name: The Monday week card can be kept as is
---
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible: "NOPE-never"
    timeout: 2500
    optional: true
- runFlow:
    when:
      visible:
        id: today.coach.peek
    commands:
      # Dải nằm sát nút Ghi nhanh. Đưa nó lên rồi mới chạm, kẻo mở nhầm bảng.
      - swipe:
          start: "50%,62%"
          end: "50%,32%"
          duration: 400
      - tapOn:
          id: today.coach.peek
      - takeScreenshot: 12-week-coach
      - tapOn:
          id: today.coach.keep
      - extendedWaitUntil:
          notVisible:
            id: today.coach.peek
          timeout: 10000
- scrollUntilVisible:
    element:
      id: today.plan.primary
    direction: UP
- assertVisible:
    id: today.plan.primary
