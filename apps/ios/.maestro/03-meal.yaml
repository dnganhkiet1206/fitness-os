# Ghi bữa trong 3 chạm (thẻ Bữa → "Ăn lại bữa này" → Lưu), rồi chọn bữa (tuỳ chọn) + OK.
appId: com.ascnd.fitnessos.dev
name: log a meal in 3 taps, pick meal + OK
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/day-card.yaml
# Dải thẻ: Giấc ngủ · Bữa · Nước · Tập (`viewAligned`). Maestro trên iOS đưa ngón tới
# điểm cuối ngay rồi GIỮ YÊN tới hết `duration` mới nhấc: thả ra vận tốc 0, nên dải
# thẻ dừng ở thẻ gần nhất. Vuốt từ tâm thẻ (~135 pt) chưa qua nửa thẻ → bật về chỗ cũ.
# Vuốt từ nhãn của thẻ KẾ đang ló ở mép phải (~340 pt, hơn một thẻ) → sang đúng một thẻ.
- swipe:
    from:
      text: "Meal"
      childOf:
        id: today.tile.meal
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: today.meal.manual
    timeout: 5000
- tapOn:
    id: today.tile.meal
- extendedWaitUntil:
    visible:
      id: logMeal.repeat
    timeout: 10000
- tapOn:
    id: logMeal.repeat
    index: 0
- tapOn:
    id: logMeal.save
- extendedWaitUntil:
    visible:
      id: logMeal.ok
    timeout: 10000
- takeScreenshot: 03-meal-saved
- tapOn:
    id: logMeal.pick.snack
- tapOn:
    id: logMeal.ok
- extendedWaitUntil:
    visible:
      id: today.tile.meal
    timeout: 10000
- takeScreenshot: 03-meal-after
