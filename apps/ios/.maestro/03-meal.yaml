# Ghi bữa trong 3 chạm (thẻ Bữa → "Ăn lại bữa này" → Lưu), rồi chọn bữa (tuỳ chọn) + OK.
appId: com.ascnd.fitnessos.dev
name: log a meal in 3 taps, pick meal + OK
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/day-card.yaml
# Vuốt dải thẻ một lần: thẻ Bữa dừng ở chỗ thẻ Giấc ngủ (cả thẻ trong màn).
- swipe:
    from:
      id: today.tile.sleep
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: today.meal.manual
    timeout: 5000
- tapOn:
    id: today.tile.meal
- extendedWaitUntil:
    visible:
      id: logMeal.repeat
    timeout: 10000
- tapOn:
    id: logMeal.repeat
    index: 0
- tapOn:
    id: logMeal.save
- extendedWaitUntil:
    visible:
      id: logMeal.ok
    timeout: 10000
- takeScreenshot: 03-meal-saved
- tapOn:
    id: logMeal.pick.snack
- tapOn:
    id: logMeal.ok
- extendedWaitUntil:
    visible:
      id: today.tile.meal
    timeout: 10000
- takeScreenshot: 03-meal-after
