# Thẻ "Hỏi Koa" ở Hôm nay mở Koa Coach (tab Tiến bộ); quay lại thì về Hôm nay.
appId: com.ascnd.fitnessos.dev
name: Ask Koa opens Coach, back returns to Today
---
- runFlow: subflows/launch.yaml
- scrollUntilVisible:
    element:
      id: today.askKoa
    direction: DOWN
    visibilityPercentage: 50
    # Cảnh Koa chuyển động liên tục nên Hôm nay không bao giờ "đứng yên": Maestro chờ
    # đứng yên tới ~11 s sau mỗi lần cuộn, 20 s chỉ đủ 2 lần thử (CI lượt 4). Chờ ngắn.
    waitToSettleTimeoutMs: 1000
    timeout: 60000
- tapOn:
    id: today.askKoa
- extendedWaitUntil:
    visible: ".*Koa Coach.*"
    timeout: 10000
- takeScreenshot: 07-coach
- runFlow: subflows/back.yaml
# Về đúng chỗ đã rời Hôm nay (đang cuộn tới thẻ Hỏi Koa).
- extendedWaitUntil:
    visible:
      id: today.askKoa
    timeout: 10000
- assertNotVisible: ".*Koa Coach.*"
- takeScreenshot: 07-back-today
