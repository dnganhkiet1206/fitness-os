# Bắt đầu buổi hôm nay (Full Body A: 2 bài × 2 set), xong từng set, chốt buổi,
# màn tổng kết (Gains cộng thêm) → "Back to Today" về Hôm nay.
appId: com.ascnd.fitnessos.dev
name: start and finish a workout session
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: today.plan.primary
- extendedWaitUntil:
    visible:
      id: workout.doneSet
    timeout: 15000
- takeScreenshot: 05-workout-start
- repeat:
    times: 6
    while:
      visible:
        id: workout.doneSet
    commands:
      - tapOn:
          id: workout.doneSet
      - runFlow:
          when:
            visible:
              id: workout.rest.skip
          commands:
            - tapOn:
                id: workout.rest.skip
- scrollUntilVisible:
    element:
      id: workout.finish
    direction: DOWN
    timeout: 10000
- tapOn:
    id: workout.finish
- extendedWaitUntil:
    visible: ".*Gains.*"
    timeout: 20000
- assertVisible: "Full Body A"
- takeScreenshot: 05-workout-summary
- scrollUntilVisible:
    element:
      id: summary.backToToday
    direction: DOWN
    timeout: 15000
- tapOn:
    id: summary.backToToday
- extendedWaitUntil:
    notVisible:
      id: summary.backToToday
    timeout: 15000
# "Today" là nhãn tab, lúc nào cũng thấy — kiểm phần tử chỉ có ở tab Hôm nay (#699).
- extendedWaitUntil:
    visible:
      id: today.plan.primary
    timeout: 15000
- takeScreenshot: 05-workout-today-after
